# Serves anthony-tong.com over a Cloudflare tunnel and auto-rebuilds on edits.
#   cd deploy && docker compose up -d
#
# - builder: runs `jekyll build --watch`, regenerating ../_site whenever any
#   source file (Markdown, layouts, includes, CSS, _config.yml) changes.
# - web: nginx serving ../_site read-only, so regenerated files go live at once.
# - cloudflared: the tunnel for anthony-tong.com (apex + www).
#
# Edit the Markdown/layouts locally and the change is public within a few
# seconds — no manual build, no restart. (deploy/build.sh remains for one-off
# or CI builds.)
services:
  builder:
    image: ruby:3.2
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /site
    environment:
      HOME: /tmp
      BUNDLE_PATH: /site/vendor/bundle
    volumes:
      - ..:/site
    command: >
      bash -lc "bundle install --quiet &&
                exec bundle exec jekyll build --watch --trace"

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [builder]
    volumes:
      - ../_site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [web]
    # Run as the host user that owns the 0400 tunnel credentials file.
    user: "1000:1000"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./tunnel-config.yml:/etc/cloudflared/config.yml:ro
      - ${HOME}/.cloudflared/b30e2185-7e2f-4174-afa9-db43a10966ba.json:/creds/b30e2185-7e2f-4174-afa9-db43a10966ba.json:ro
