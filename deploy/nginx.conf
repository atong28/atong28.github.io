server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /publications/ -> /publications/index.html, else 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Long cache for fingerprint-free static assets is fine for a personal site;
    # keep HTML uncached so content edits show up immediately after a rebuild.
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
