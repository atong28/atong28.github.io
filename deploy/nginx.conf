server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /publications/ -> /publications/index.html, else 404 page.
    location / {
        try_files $uri $uri/ $uri.html =404;
        # Revalidate every request so local edits (built into _site by the
        # watcher) show up immediately instead of being held in the Cloudflare
        # edge cache. nginx answers unchanged files with a fast 304.
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
