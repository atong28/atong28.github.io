{%- comment -%}
  Captioned image; path relative to /images.
  Usage:  {% include figure.html src="cat.JPG" caption="My cat" width="60%" %}
{%- endcomment -%}
<figure class="embed embed--figure" style="{% if include.width %}max-width:{{ include.width }};{% endif %}">
  <img src="/images/{{ include.src }}" alt="{{ include.caption | default: '' }}" loading="lazy">
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
