<meta charset="utf-8">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | default: 'Anthony Tong — CS + Applied Math, UC San Diego. Building tools for interdisciplinary AI.' }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | default: 'Building tools for interdisciplinary AI.' }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="{{ site.title }}">

{% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<link rel="stylesheet" href="/assets/css/site.css?v={{ site.time | date: '%s' }}">
<link rel="shortcut icon" href="/images/fav.png">
<link rel="apple-touch-icon" href="/images/fav.png">

<!-- Analytics -->
<script src="https://cdn.counter.dev/script.js" data-id="4c8f7caa-2b55-46cd-a995-2c4633303773" data-utcoffset="8"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N5JY1E21"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-T5N5JY1E21');
</script>
